name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic image QA dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-quality.txt
      - name: Validate structured examples
        run: python3 scripts/validate_project.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run host protocol E2E dry-run
        run: python3 scripts/demo_e2e.py
